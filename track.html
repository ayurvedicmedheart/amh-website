<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order - AMH</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5faf6;
  color:#245b3b;
}

.container{
  max-width:500px;
  margin:50px auto;
  padding:20px;
}

.card{
  background:white;
  padding:35px 25px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  text-align:center;
}

.logo{
  width:180px;
  max-width:80%;
  margin-bottom:20px;
}

h1{
  font-size:28px;
  margin-bottom:10px;
}

p{
  color:#666;
  font-size:16px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:15px;
  margin:20px 0 12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#3d8054;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#2f6843;
}

.error{
  color:#d33;
  margin-top:12px;
  display:none;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <img src="logo.png" class="logo" alt="AMH Logo">

    <h1>📦 Track Your Order</h1>

    <p>Enter your AWB / Tracking Number to check your shipment status.</p>

    <input
      type="text"
      id="awb"
      placeholder="Enter AWB Number"
      autocomplete="off"
    >

    <button onclick="trackOrder()">
      Track Order
    </button>

    <div class="error" id="error">
      Please enter a valid AWB number.
    </div>

  </div>
</div>

<script>
function trackOrder(){

  const awb = document.getElementById("awb").value.trim();
  const error = document.getElementById("error");

  if(!awb){
    error.style.display = "block";
    return;
  }

  error.style.display = "none";

  window.location.href =
    "https://ayurvedicmedheart.github.io/amh-tracking/?awb=" +
    encodeURIComponent(awb);
}
</script>

</body>
</html>
